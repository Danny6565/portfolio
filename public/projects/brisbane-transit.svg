  <path d="M 800,0 L 770,0 Q 760,80 756,160 Q 752,240 755,310 Q 758,380 768,450 L 800,450 Z"
        fill="#0f2240" fill-opacity="0.6"/>

  <!-- Brisbane River -->
  <!-- Outer glow (very subtle) -->
  <path d="M -10,335 C 80,336 145,339 182,343 C 220,347 248,356 272,364
           C 292,371 322,374 352,372 C 370,371 387,366 402,356
           C 417,346 430,333 442,317 C 452,303 460,288 474,274
           C 487,262 507,254 532,250 C 556,246 582,245 612,246
           C 645,248 678,250 720,252 C 755,254 780,255 800,256"
        fill="none" stroke="#1a4a7a" stroke-width="46" stroke-opacity="0.18" stroke-linecap="round"/>

  <!-- River body -->
  <path d="M -10,335 C 80,336 145,339 182,343 C 220,347 248,356 272,364
