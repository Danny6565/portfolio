  <text x="778" y="357" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#71717a" text-anchor="end">612</text>

  <circle cx="672" cy="371" r="5" fill="#f59e0b"/>
  <text x="683" y="375" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#d4d4d8">CityTrain</text>
  <text x="778" y="375" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#71717a" text-anchor="end">148</text>

  <circle cx="672" cy="389" r="5" fill="#34d399"/>
  <text x="683" y="393" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#d4d4d8">Ferry</text>
