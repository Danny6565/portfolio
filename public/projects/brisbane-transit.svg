  <rect x="432" y="212" width="6" height="74"  rx="1" fill="#ffffff" fill-opacity="0.011"/>

  <!-- South Bank parklands (south of CBD, between CBD and river, x:365–415, y:295–338) -->
  <rect x="365" y="298" width="50" height="38" rx="3" fill="#10403a" fill-opacity="0.35"/>

  <!-- Bridges crossing the river -->
  <!-- Victoria Bridge (CBD ↔ South Bank, x≈399, river centre y≈356) -->
  <line x1="399" y1="340" x2="399" y2="372" stroke="#2a6aaa" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Kurilpa Bridge (pedestrian, x≈374, river centre y≈365) -->
  <line x1="374" y1="349" x2="374" y2="381" stroke="#2a6aaa" stroke-width="1.8" stroke-opacity="0.4"/>
  <!-- Story Bridge (x≈454, river centre y≈300) -->
  <line x1="454" y1="284" x2="454" y2="318" stroke="#2a6aaa" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Captain Cook Bridge (x≈342, motorway, river centre y≈372) -->
  <line x1="342" y1="355" x2="342" y2="389" stroke="#2a6aaa" stroke-width="2" stroke-opacity="0.35"/>

  <!-- ══ ROUTE LINES ══ -->

  <!-- TRAINS (amber) — 5 lines radiating from Roma Street / CBD -->
