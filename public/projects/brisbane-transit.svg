<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">

  <!-- Land background -->
  <rect width="800" height="450" fill="#0c1220"/>

  <!-- Moreton Bay — water area on the far right -->
  <path d="M 800,0 L 745,0 Q 730,60 725,130 Q 718,210 722,280 Q 726,350 742,420 L 800,450 Z"
