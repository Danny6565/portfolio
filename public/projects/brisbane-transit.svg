  <text x="683" y="411" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#d4d4d8">Metro</text>
  <text x="778" y="411" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#71717a" text-anchor="end">59</text>

