  <polyline points="400,238 406,204 414,170 422,138 430,104 435,68 438,32 440,0"
            fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <!-- Cleveland: East (follows river to bay) -->
  <polyline points="406,244 450,240 500,238 552,237 606,239 658,243 712,249 762,253 800,256"
            fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <!-- Airport / Doomben: NE -->
  <polyline points="408,237 442,220 472,207 505,197 540,189 574,184 610,180 646,178"
            fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.5" stroke-linejoin="round"/>

