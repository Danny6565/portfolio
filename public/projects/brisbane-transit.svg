  <rect x="369" y="262" width="54" height="9"  rx="1" fill="#ffffff" fill-opacity="0.019"/>
  <rect x="371" y="278" width="46" height="8"  rx="1" fill="#ffffff" fill-opacity="0.017"/>
  <!-- Vertical streets -->
  <rect x="376" y="196" width="6" height="94"  rx="1" fill="#ffffff" fill-opacity="0.014"/>
  <rect x="390" y="200" width="6" height="92"  rx="1" fill="#ffffff" fill-opacity="0.014"/>
  <rect x="404" y="204" width="6" height="88"  rx="1" fill="#ffffff" fill-opacity="0.014"/>
